name: Build Portable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv & install Python deps
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          corepack: true

      - name: Enable Corepack
        run: corepack enable

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package single-file exe (PyInstaller)
        run: .\.venv\Scripts\python.exe -m PyInstaller english_practice_machine.spec --noconfirm --clean

      - name: Build green portable zip
        shell: pwsh
        run: .\build-green-portable.ps1

      - name: List artifacts
        shell: pwsh
        run: |
          Get-Item dist\*.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Get-Item .build\*.zip -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-practice-machine-portable-exe
          path: dist/英语刷题机.exe
          if-no-files-found: warn

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-practice-machine-portable-zip
          path: .build/英语刷题机-便携版.zip
          if-no-files-found: error

      - name: Prepare ASCII-named release files
        shell: pwsh
        run: |
          Copy-Item dist/英语刷题机.exe dist/english-practice-machine.exe -Force
          Copy-Item .build/英语刷题机-便携版.zip .build/english-practice-machine-portable.zip -Force

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/english-practice-machine.exe
            .build/english-practice-machine-portable.zip
          generate_release_notes: true